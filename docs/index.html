  --ink:#E2ECEC; --ink-2:#9FB1B2; --ink-3:#718385;
  --accent:#48ADB4; --accent-2:#63C4CA; --accent-soft:#123034; --accent-ink:#04191B;

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:4px 8px}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.topbar{display:flex;align-items:center;gap:14px;padding:0 22px;height:52px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand .bolt{color:var(--accent)}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.topbar .env{margin-left:auto;font-size:11px;color:var(--ink-3);white-space:nowrap}
.topbar .env b{color:var(--ink-2);font-weight:500}

.wrap{max-width:1180px;margin:0 auto;padding:18px 22px 60px}
.home-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:0 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.home-head h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.012em}
.home-head p{margin:3px 0 0;font-size:11.5px;color:var(--ink-3)}
.pickers{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.picker{display:flex;flex-direction:column;gap:5px}
.picker>em{font-style:normal;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.picker>div{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pk{padding:4px 11px;border:1px solid var(--line);border-radius:5px;font-size:12px;color:var(--ink-2);transition:.13s;background:var(--surface)}
.pk:hover{border-color:var(--accent-2);color:var(--accent)}
.pk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.pk.sm{padding:3px 8px;font-size:11.5px}
.pk.view[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px 16px 13px;min-width:0}
.card.wide{grid-column:1/-1}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:13px;font-weight:600}
.card-h .tag{margin-left:auto;font-size:10px;letter-spacing:.05em;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;text-align:right}
.sub{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin:0 0 10px}
.hint{font-size:11.5px;color:var(--ink-3)}

.status{flex:none;font-size:9.5px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:3px;text-transform:uppercase;line-height:1.5;white-space:nowrap}
.st-ok{background:var(--low-bg);color:var(--low)}
.st-est{background:var(--notice-bg);color:var(--notice)}
.st-chk{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.st-off{background:var(--surface-2);color:var(--ink-3)}

/* TOU band */
.now{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.now b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;letter-spacing:-.02em}
.stat{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.s-low{background:var(--low-bg);color:var(--low)} .s-mid{background:var(--mid-bg);color:var(--mid)} .s-peak{background:var(--peak-bg);color:var(--peak)}
.now .subr{font-size:11.5px;color:var(--ink-3);margin-left:auto;text-align:right;line-height:1.45}
.touwrap{position:relative;margin:14px 0 6px}
.tou{display:flex;height:36px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.tou-seg{display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;border-right:1px solid rgba(255,255,255,.28);overflow:hidden;white-space:nowrap}
.tou-seg:last-child{border-right:0}
.t-low{background:var(--low)} .t-mid{background:var(--mid)} .t-peak{background:var(--peak)}
.disc{position:absolute;top:-6px;height:48px;border:2px dashed var(--disc);border-radius:4px;pointer-events:none;background:transparent}
.disc::after{content:"11~14시 전력량요금 50%";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--disc);white-space:nowrap;font-weight:600}
.axis{display:flex;margin-top:4px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3)}
.axis span{flex:1} .axis span:last-child{flex:0}
.nowmark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px;z-index:2;box-shadow:0 0 0 2px var(--surface)}
.nowmark::after{content:"지금";position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--ink);white-space:nowrap;font-weight:600}
.legend{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.d-low{background:var(--low)} .d-mid{background:var(--mid)} .d-peak{background:var(--peak)}
.d-disc{background:var(--disc)}
.tou-list{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;margin-top:10px}
.tou-list dt{white-space:nowrap;font-weight:500}
.tou-list dd{margin:0;font-family:"IBM Plex Mono",monospace;font-size:12px}

/* prog */
.prog{display:flex;height:42px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.prog-seg{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 11px;color:#fff;border-right:1px solid rgba(255,255,255,.3);overflow:hidden}
.prog-seg:last-child{border-right:0}
.prog-seg b{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:500;line-height:1.2}
.prog-seg span{font-size:9.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p1{background:var(--low)} .p2{background:var(--mid)} .p3{background:var(--peak)}
.prog-ax{display:flex;justify-content:flex-end;margin-top:4px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3)}
.minirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:14px}
.mini h4{margin:0 0 6px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mini table{width:100%;border-collapse:collapse;font-size:12.5px}
.mini td{padding:4px 0;border-bottom:1px solid var(--line-soft)}
.mini td:last-child{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.mini tr:last-child td{border-bottom:0}
.supnote{margin-top:12px;padding:9px 12px;border-radius:6px;background:var(--peak-bg);color:var(--peak);font-size:12px;line-height:1.55}
.supnote b{font-weight:600}

/* calc */
.calc{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.calc-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:11px}
.calc-top label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.calc-top input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.calc-use{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:500;min-width:96px;text-align:right}
.calc-use em{font-style:normal;font-size:11px;color:var(--ink-3);margin-left:3px}
.stack{display:flex;height:26px;border-radius:4px;overflow:hidden;border:1px solid var(--line);margin-bottom:8px}
.stack div{border-right:1px solid rgba(255,255,255,.3)} .stack div:last-child{border-right:0}
.calc-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.calc-tbl td{padding:4px 0;border-bottom:1px solid var(--line-soft)}
.calc-tbl td:last-child{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.calc-tbl tr.sum td{border-bottom:0;border-top:2px solid var(--line);font-weight:600;padding-top:7px}
.calc-tbl tr.sum td:last-child{font-size:14.5px;color:var(--accent)}
.calc-tbl tr.dim td{color:var(--ink-3)}
.assume{margin-top:9px;font-size:11px;color:var(--ink-3);line-height:1.55;padding-left:9px;border-left:2px solid var(--line)}
.assume b{color:var(--warn);font-weight:600}
.shares{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:9px 0 4px;font-size:11.5px}
.shares input{width:56px;text-align:right;font-family:"IBM Plex Mono",monospace;padding:3px 6px}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.vs>div{padding:11px 13px;border-radius:7px;border:1px solid var(--line);background:var(--surface-3)}
.vs h5{margin:0 0 7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.vs b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:500;display:block;line-height:1.3}
.vs .win{color:var(--low)} .vs .lose{color:var(--peak)}
.vs small{display:block;font-size:11px;color:var(--ink-3);margin-top:3px}

/* rate table + chart */
.rt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.rt th,.rt td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line-soft)}
.rt th{font-weight:500;color:var(--ink-3);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.rt th:first-child,.rt td:first-child{text-align:left;white-space:nowrap;font-weight:500}
.rt td:not(:first-child){font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.rt td.def{color:var(--ink-3)}
.rt tr.hl td{background:var(--accent-soft)}
.chart{margin-top:12px;overflow-x:auto}
.chart svg{display:block;max-width:100%;height:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;margin:0 0 10px}
.kv dt{color:var(--ink-3);white-space:nowrap}
.kv dd{margin:0;font-weight:500}
.srcchip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:5px;border:1px solid var(--line-soft);background:var(--surface-3);font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help}
.srcchip::before{content:"근거";font-family:"IBM Plex Sans KR",sans-serif;font-weight:600;font-size:9px;letter-spacing:.06em;color:var(--accent);flex:none}
.srcchip.chk{border-style:dashed;color:var(--warn)} .srcchip.chk::before{content:"확인필요";color:var(--warn)}
.srcrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* policy rows */
.prow{display:grid;grid-template-columns:92px 1fr auto;gap:4px 12px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:12.5px;align-items:start}
.prow:first-of-type{border-top:0;padding-top:2px}
.prow .d{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);padding-top:2px;line-height:1.4}
.scrollbox{max-height:420px;overflow:auto;padding-right:4px}
.prow .t{font-weight:600}
.prow .x{color:var(--ink-2);font-size:12px;line-height:1.55}
.prow .x b{font-weight:600;color:var(--ink)}
.strip{display:flex;align-items:center;gap:11px;padding:9px 13px;border-radius:7px;background:var(--notice-bg);color:var(--notice);font-size:12.5px;margin-bottom:12px;flex-wrap:wrap}
.strip b{font-weight:600}
.strip.warn{background:var(--warn-bg);color:var(--warn)}
.strip.ok{background:var(--low-bg);color:var(--low)}
.na{color:var(--ink-3);font-weight:400}
.hidden{display:none!important}
@media (max-width:640px){
  .topbar{padding:0 16px} .wrap{padding:14px 16px 50px}
  .prow{grid-template-columns:1fr} .prow .d{min-width:0}
  .card-h .tag{margin-left:0;width:100%;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const now = new Date();
const S = { view:'요금', region:'육지', kind:'주택용', month:now.getMonth()+1, day:'평일',
            use:350, share:{low:70,mid:20,peak:10}, defer:false,
            rateSel:{}, evVolt:'저압', evH:300, evE:200, evK:7, evShare:{low:80,mid:15,peak:5}, evHome:'누진', hpL:300, hpK:4 };
const KINDS = ['주택용','일반용','EV 충전전력'];
const won = n => Math.round(n).toLocaleString('ko-KR');
const $ = s => document.querySelector(s);
const BAND = {경:'low',중:'mid',최:'peak'};
const BANDNAME = {low:'경부하',mid:'중간부하',peak:'최대부하'};

function seasonOf(m){
  if(m>=6&&m<=8) return {key:'s',name:'여름철',range:'6/1~8/31',col:'s'};
  if(m>=11||m<=2) return {key:'w',name:'겨울철',range:'11/1~익년 2월 말일',col:'w'};
  return {key:'sa',name:'봄·가을철',range:'3/1~5/31, 9/1~10/31',col:'sa'};
}
function touRow(region, season, day, defer){
  const t = DATA.tou;
  let base;
  if(region==='제주') base = t[7].h;
  else if(defer) base = (season.key==='w' ? t[1] : t[0]).h;
  else base = (season.key==='s'?t[2]:season.key==='sa'?t[3]:t[4]).h;
  if(day==='공휴일') return base.map(()=>'경');
  if(day==='토요일') return base.map(x=>x==='최'?'중':x);
  return base;
}
function segsOf(h){
  const out=[]; h.forEach((x,i)=>{ const k=BAND[x]; if(out.length&&out[out.length-1].k===k) out[out.length-1].h++; else out.push({k,h:1,start:i}); });
  return out;
}
function bandHtml(h, labels=true){
  const segs=segsOf(h);
  const cells=segs.map(s=>`<div class="tou-seg t-${s.k}" style="flex-grow:${s.h}">${labels&&s.h>=3?BANDNAME[s.k]:''}</div>`).join('');
  const ticks=[0,3,6,9,12,15,18,21,24].map(x=>`<span>${x}</span>`).join('');
  return `<div class="tou">${cells}</div><div class="axis">${ticks}</div>`;
}
function ranges(h){
  const r={low:[],mid:[],peak:[]};
  segsOf(h).forEach(s=>r[s.k].push(`${String(s.start).padStart(2,'0')}~${String(s.start+s.h).padStart(2,'0')}`));
  return r;
}
function srcChip(txt){
  const chk=/확인필요/.test(txt||'');
  const ids=(txt||'').match(/\b(A\d|S\d\d)\b/g)||[];
  const tip=ids.map(i=>DATA.sources[i]?`${i}: ${DATA.sources[i].name} (${DATA.sources[i].org}, ${DATA.sources[i].grade}등급)`:i).join('\n');
  return `<span class="srcchip${chk?' chk':''}" title="${tip.replace(/"/g,'&quot;')}">${txt||'—'}</span>`;
}
function statusChip(txt){
  if(/확인필요/.test(txt)) return '<span class="status st-chk">확인필요</span>';
  if(/추정/.test(txt)) return '<span class="status st-est">추정</span>';
  if(/종료|폐지/.test(txt)) return '<span class="status st-off">종료</span>';
  return '<span class="status st-ok">확정</span>';
}

/* ---------- 누진 계산 (주택용 시트 A-1 예시와 동일 로직) ---------- */
function progTable(volt, month){
  const hot=(month===7||month===8);
  const rows=DATA.prog.filter(r=>r.volt===volt && (hot?/하계\(/.test(r.season):/기타/.test(r.season)));
  const sup=DATA.prog.find(r=>r.volt===volt && /슈퍼/.test(r.tier));
  return {rows, sup, hot, supOn:[7,8,12,1,2].includes(month)};
}
function calcProg(u, volt, month){
  const t=progTable(volt,month);
  const b1=t.rows[0].hi, b2=t.rows[1].hi, r=t.rows.map(x=>x.rate);
  const capped=(t.supOn&&u>1000)?1000:u, excess=(t.supOn&&u>1000)?u-1000:0;
  const q=[Math.min(capped,b1), Math.max(0,Math.min(capped,b2)-b1), Math.max(0,capped-b2)];
  const energy=q[0]*r[0]+q[1]*r[1]+q[2]*r[2]+excess*t.sup.rate;
  const base=u<=b1?t.rows[0].base:u<=b2?t.rows[1].base:t.rows[2].base;
  const sub=Math.max(1000, base+energy);
  const C=DATA.common;
  const climate=u*C['기후환경요금'], fuel=u*C['연료비조정요금'];
  const bill=sub+climate+fuel, vat=bill*C['부가가치세'], fund=bill*C['전력산업기반기금'];
  return {q,r,excess,energy,base,sub,climate,fuel,bill,vat,fund,total:Math.floor((bill+vat+fund)/10)*10,b1,b2,t};
}
function calcTou(u, season, sh){
  const H=DATA.tou_house;
  const rates=season.key==='sa'?H.rates['봄·가을']:H.rates['여름·겨울'];
  const supOn=season.key!=='sa';
  const capped=(supOn&&u>1000)?1000:u, excess=(supOn&&u>1000)?u-1000:0;
  const tot=(sh.low+sh.mid+sh.peak)||1;
  const kwh=[capped*sh.low/tot, capped*sh.mid/tot, capped*sh.peak/tot];
  const avg=(sh.low*rates[0]+sh.mid*rates[1]+sh.peak*rates[2])/tot;
  const energy=kwh[0]*rates[0]+kwh[1]*rates[1]+kwh[2]*rates[2]+excess*H.super;
  return {rates,avg,kwh,excess,energy,base:H.monthly,sub:H.monthly+energy};
}
function breakeven(volt, month, season, sh){
  let first=null, prev=null;
  for(let q=10;q<=3000;q+=10){
    const d=calcProg(q,volt,month).sub-calcTou(q,season,sh).sub;
    if(prev!==null && prev<0 && d>=0 && first===null) first=q;
    prev=d;
  }
  return first;
}

function rateCard(season){
  const kind=S.kind;
  const rows=DATA.rates.filter(r=>r.kind.startsWith(kind)&&!r.kind.includes('보완'));
  const groups=[...new Set(rows.map(r=>r.kind))].filter(g=>!g.includes('보완'));
  const g=S.rateSel[kind+'_g']||groups[groups.length-1];
  const grows=rows.filter(r=>r.kind===g);
  const combos=[...new Set(grows.map(r=>r.volt+'|'+r.sel))];
  const combo=S.rateSel[g+'_c']||combos[0];
  const [volt,sel]=combo.split('|');
  const sub=grows.filter(r=>r.volt===volt&&r.sel===sel);
  const isTou=sub.length>1;
  const defer=S.defer&&g==='산업용(을)'&&S.region!=='제주';
  const col=season.col;
  const val=r=>defer&&r.def?r.def[['s','sa','w'].indexOf(col)]:r[col];
  const chk=/확인필요/.test(sub[0].src);
  // chart
  const maxV=Math.max(...sub.flatMap(r=>[r.s,r.sa,r.w].concat(r.def||[]).filter(x=>x!=null)));
  const W=520,Hh=150,pad=28,gw=(W-pad*2)/sub.length;
  const seasons=[['s','여름'],['sa','봄·가을'],['w','겨울']];
  const bars=sub.map((r,i)=>seasons.map(([k,lab],j)=>{
    const v=defer&&r.def?r.def[j]:r[k]; const bh=v/maxV*(Hh-40); const x=pad+i*gw+8+j*((gw-16)/3);

    ${g==='일반용(갑)Ⅱ'?`<p class="sub">선택Ⅲ·Ⅳ는 2026.6.1 신설된 계절별 단일요금(갑Ⅰ과 동일 단가). 6~11월분은 Ⅰ↔Ⅲ, Ⅱ↔Ⅳ 중 낮은 쪽 자동 적용, 신청분은 12월분부터.</p>`:''}

function touBandNow(season){
  if(S.month!==now.getMonth()+1||S.day!=='평일') return null;
  const h=touRow(S.region,season,'평일',false); return BAND[h[now.getHours()]];
}

function evCard(season){
  const jeju=S.region==='제주';
  const rows=DATA.ev.filter(r=>r.volt.startsWith(S.evVolt));
  const col=season.col;
  const sh=S.evShare, tot=(sh.low+sh.mid+sh.peak)||1;
  const r=rows.map(x=>x[col]);
  const avg=(sh.low*r[0]+sh.mid*r[1]+sh.peak*r[2])/tot;
  const base=rows[0].base*S.evK;
  const sep=base+S.evE*avg;
  const hv=S.evVolt;
  const discOn=season.key==='sa';
  const tou=S.evHome==='계시별';
  /* 집 요금: 누진 P() 또는 계시별 T(). 합산 시 충전량은 '충전 시간대 비중'으로 T에 들어간다 */
  let home, homeAll;
  if(!tou){ home=calcProg(S.evH,hv,S.month).sub; homeAll=calcProg(S.evH+S.evE,hv,S.month).sub; }
  else {
    home=calcTou(S.evH,season,S.share).sub;
    const H=S.evH,E=S.evE,Q=H+E, hs=S.share, ht=(hs.low+hs.mid+hs.peak)||1;
    const mix={low:(H*hs.low/ht+E*sh.low/tot)/Q*100, mid:(H*hs.mid/ht+E*sh.mid/tot)/Q*100, peak:(H*hs.peak/ht+E*sh.peak/tot)/Q*100};
    homeAll=calcTou(Q,season,mix).sub;
  }
  const inc=homeAll-home;
  const totSep=home+sep, totAll=homeAll;
  return `
  <div class="card wide">
    <div class="card-h">
      <h3>전기자동차 충전전력 — 별도 계약 (자가소비용)</h3>
      <span style="display:flex;gap:4px">${['저압','고압'].map(v=>`<button class="pk sm ev" data-v="${v}" aria-pressed="${v===S.evVolt}">${v}</button>`).join('')}</span>
      <span class="tag">세칙 별표4 제4호 · 별도 계약종별 · ${season.name}</span>
    </div>
    <dl class="kv"><dt>기본요금</dt><dd class="mono">${won(rows[0].base)} 원/kW (요금적용전력)</dd><dt>시간대</dt><dd>${jeju?'제주: 22~08 경 / 08~16 중 / 16~22 최':'2026.4.16~ 개편 시간대 (위 시간대 카드)'}</dd></dl>
    <table class="rt"><thead><tr><th>시간대</th><th>여름</th><th>봄·가을</th><th>겨울</th></tr></thead><tbody>
      ${rows.map((x,i)=>`<tr><td><span class="dot d-${['low','mid','peak'][i]}"></span>${x.band}</td>${['s','sa','w'].map(k=>`<td class="${col===k?'':'def'}"><b style="font-weight:${col===k?600:400}">${x[k]}</b></td>`).join('')}</tr>`).join('')}
    </tbody></table>
    <div class="strip ${discOn?'ok':''}" style="margin-top:10px"><b>봄·가을 주말·공휴일 11~14시 전력량요금 50%</b><span style="font-size:11.5px">2026.4.18~2030.12.31 · ${S.evVolt} 토요일 ${(r[1]/2).toFixed(1)}원 / 일·공휴일 ${(r[0]/2).toFixed(1)}원 ${discOn?'— 이번 달 적용':'— 3~5·9~10월만'}</span></div>
    <div class="calc">
      <div class="shares">
        <span style="color:var(--ink-3)">기존 집 사용량</span><input type="number" id="evH" min="0" max="2000" step="10" value="${S.evH}">kWh
        <span style="color:var(--ink-3)">월 충전량</span><input type="number" id="evE" min="0" max="1000" step="10" value="${S.evE}">kWh
        <span style="color:var(--ink-3)">요금적용전력</span><input type="number" id="evK" min="1" max="50" value="${S.evK}">kW
      </div>
      <div class="shares">
        <span style="color:var(--ink-3)">충전 시간대 비중</span>
        경 <input type="number" id="evL" min="0" max="100" value="${sh.low}">% 중 <input type="number" id="evM" min="0" max="100" value="${sh.mid}">% 최 <input type="number" id="evP" min="0" max="100" value="${sh.peak}">%
        <span class="hint">가중단가 <b class="mono">${avg.toFixed(2)}</b>원/kWh</span>
      </div>
      <div class="shares">
        <span style="color:var(--ink-3)">집 요금제</span>
        ${['누진','계시별'].map(v=>`<button class="pk sm evhome" data-v="${v}" aria-pressed="${v===S.evHome}">${v}</button>`).join('')}
        <span class="hint">${tou?'집은 계시별 선택요금(12,930원 + 시간대 단가, 집 시간대 비중은 주택용 탭 값 '+S.share.low+'/'+S.share.mid+'/'+S.share.peak+'%)':'집은 주택용 누진 '+hv}</span>
      </div>
      <table class="calc-tbl" style="margin-top:8px"><thead><tr><th style="text-align:left;font-weight:500;color:var(--ink-3);font-size:11px">월 요금 (기본+전력량)</th><th style="text-align:right;font-weight:500;color:var(--ink-3);font-size:11px">① 집만 (${S.evH}kWh)</th><th style="text-align:right;font-weight:500;color:var(--ink-3);font-size:11px">② 집 + EV 별도 계약</th><th style="text-align:right;font-weight:500;color:var(--ink-3);font-size:11px">③ 집 + EV 합산</th></tr></thead><tbody>
        <tr><td>집 요금 (${tou?'계시별 T':'누진 P'})</td><td>${won(home)}</td><td>${won(home)}</td><td>${won(homeAll)} <span class="na" style="font-size:10.5px">(${S.evH}+${S.evE}kWh)</span></td></tr>
        <tr><td>EV 계약 기본요금 ${won(rows[0].base)} × ${S.evK}kW</td><td>—</td><td>${won(base)}</td><td>—</td></tr>
        <tr><td>EV 계약 전력량 ${S.evE}kWh × ${avg.toFixed(2)}원</td><td>—</td><td>${won(S.evE*avg)}</td><td>—</td></tr>
        <tr class="sum"><td>합계</td><td>${won(home)} 원</td><td style="color:${totSep<totAll?'var(--low)':'var(--peak)'}">${won(totSep)} 원</td><td style="color:${totSep<totAll?'var(--peak)':'var(--low)'}">${won(totAll)} 원</td></tr>
      </tbody></table>
      <div class="vs">
        <div><h5>EV 때문에 늘어나는 요금 · 별도 계약</h5><b class="${sep<inc?'win':'lose'}">+${won(sep)} 원</b><small>② − ①</small></div>
        <div><h5>EV 때문에 늘어나는 요금 · 합산</h5><b class="${sep<inc?'lose':'win'}">+${won(inc)} 원</b><small>③ − ①${tou?' · 충전분은 충전 시간대 비중으로':' · 누진 상위 구간 단가로'}</small></div>
        <div><h5>결론</h5><b class="${sep<inc?'win':'lose'}">${sep<inc?'별도 계약':'합산'}이 월 ${won(Math.abs(sep-inc))}원 유리</b><small>${tou?'집이 계시별이면 합산 충전분도 경부하 단가라 별도 계약 이점이 작아짐':'집이 누진이면 충전량이 상위 구간(214.6/307.3원)에 쌓임'}</small></div>
      </div>
      <p class="assume"><b>가정값 기반.</b> 요금적용전력 K는 충전기 명판(7kW)과 다를 수 있습니다(계약전력·최대수요 기준). 시설부담금·계량기·충전 손실·주말 할인은 미반영. 기후환경·연료비·세금은 ①②③ 모두 같은 kWh에 붙어 비교에서 제외.</p>
    </div>
    <div class="srcrow">${srcChip(rows[0].src)}${srcChip('A2 제48조의7 (주말 할인) / 확정')}${srcChip('S03·S22 (특례할인 2022.7 폐지) / 확정')}</div>
  </div>`;
}

/* ---------- 히트펌프 3선택지 ---------- */
function hpCard(season){
  const volt=S.rateSel.houseVolt||'저압', jeju=S.region==='제주';
  const H=S.use, L=S.hpL, K=S.hpK;
  const g=DATA.rates.find(r=>r.kind==='일반용(갑)Ⅰ'&&r.volt==='저압');
  const rg=g[season.col];
  const c1=calcProg(H+L,volt,S.month).sub;
  const c2=calcProg(H,volt,S.month).sub + g.base*K + rg*L;
  const c3=calcTou(H+L,season,S.share).sub;
  const best=Math.min(c1,c2,c3);
  const tile=(n,v,sub)=>`<div><h5>${n}</h5><b class="${v===best?'win':''}">${won(v)} 원</b><small>${sub}</small></div>`;
  const R=DATA.tou_house.rates;
  return `
  <div class="card wide">
    <div class="card-h"><h3>히트펌프 설치 가구 — 3가지 요금 선택지</h3><span class="tag">계약종별_쉬운설명 E절 · 주택용 C절 · ${season.name}</span></div>
    <table class="rt"><thead><tr><th>선택지</th><th style="text-align:left">한 줄로</th><th style="text-align:left">요금 구조 — 여름(6~8월) / 봄·가을(3~5·9~10월) / 겨울(11~2월)</th><th>계량기</th><th style="text-align:left">${jeju?'제주':'육지'} 자격</th></tr></thead><tbody>
      <tr><td>① 누진제 유지</td><td style="text-align:left;font-family:inherit">집 전체(히트펌프 포함)를 기존 누진으로</td><td style="text-align:left">910/1,600/7,300원/호 + 120/214.6/307.3 (계절 무관, 7~8월만 구간 300/450kWh)</td><td>1개</td><td style="text-align:left;font-family:inherit">누구나</td></tr>
      <tr><td>② 히트펌프 분리 일반용</td><td style="text-align:left;font-family:inherit">히트펌프만 별도 계량 → 일반용(갑)Ⅰ(누진 없음), 나머지는 누진</td><td style="text-align:left">일반용(갑)Ⅰ 저압: ${won(g.base)}원/kW + 여름 ${g.s} / 봄·가을 ${g.sa} / 겨울 ${g.w} (시간대 구분 없음, 누진 없음)</td><td>2개</td><td style="text-align:left;font-family:inherit">신재생법 제13조 인증 지열·공기열 설비 (약관 제56조)</td></tr>
      <tr><td>③ 주택용 계시별</td><td style="text-align:left;font-family:inherit">집 전체를 시간대별 요금으로</td><td style="text-align:left">12,930원 고정 + 경 ${R['여름·겨울'][0]} / ${R['봄·가을'][0]} / ${R['여름·겨울'][0]} · 중 ${R['여름·겨울'][1]} / ${R['봄·가을'][1]} / ${R['여름·겨울'][1]} · 최 ${R['여름·겨울'][2]} / ${R['봄·가을'][2]} / ${R['여름·겨울'][2]}</td><td>1개 (시간대)</td><td style="text-align:left;font-family:inherit">${jeju?'주거용 전 가구 (2021.9.1~)':'인증 지열·공기열 설비 설치 주거용만 (2026.4.1~) — 일반 EHP·시스템에어컨 등 미인증 히트펌프는 해당 없음, ②와 동시 불가'}</td></tr>
    </tbody></table>
    <div class="calc">
      <div class="shares">
        <span style="color:var(--ink-3)">집 기본 사용량</span><b class="mono">${H}</b>kWh <span class="hint">(위 슬라이더)</span>
        <span style="color:var(--ink-3)">히트펌프 사용량</span><input type="number" id="hpL" min="0" max="2000" step="10" value="${L}">kWh

        ${tile('③ 계시별 (집+HP)',c3,'12,930 + '+(H+L)+'×'+calcTou(H+L,season,S.share).avg.toFixed(2))}
      </div>
      <p class="assume"><b>"히트펌프 설치 가구" ≠ 자격.</b> 육지 ③ 자격은 ⓐ 열원이 지열·공기열 ⓑ 신재생법 인증 제품(공기열은 기후부 보조금 선정·공지 제품 인증 간주) ⓒ 주거용·분리계약 없음 — 셋 다 충족해야 함. <b>핵심 차이.</b> ②만 계량기 2개 · ②는 히트펌프를 누진 밖으로 빼고 ③은 누진 자체를 버림 · <b>②와 ③은 동시 불가</b>(세칙 48조의5 ①2 단서). ②의 계량기 공사비·③의 1년 유지 의무 미반영. 기후환경·연료비·세금은 동일 kWh라 제외.</p>
    </div>
    <div class="srcrow">${srcChip('A1 제56조·별표1 1.가·1.나 / 확정')}${srcChip('A2 별표12·제48조의5 / 확정')}${srcChip('S14 전기신문 600kWh 역전점 / 추정')}</div>
  </div>`;
}

        <p class="hint" style="margin:8px 0 0">전압이 높을수록 변압 설비를 고객이 부담하므로 단가가 조금 싸다. 가정은 저압 또는 고압A(아파트)뿐이고, 아파트 세대 청구는 단지가 고압A로 받아도 주택용 고압 누진.</p>
      </div>
    </div>

    <div class="mini" style="margin-top:14px">
      <h4>③ 일반용(갑)Ⅱ 고압A 선택Ⅰ~Ⅳ — 같은 고객이 고르는 4가지 옵션 (${name} 단가, 원/kW·원/kWh)</h4>
      <table class="rt">${th('선택','기본요금','전력량요금','성격')}<tbody>
        ${td('Ⅰ',base('Ⅰ'),tou('Ⅰ'),'계시별 기본형')}
        ${td('Ⅱ',base('Ⅱ')+' <span class="na">(+1,060)</span>',tou('Ⅱ')+' <span class="na">(−5.3)</span>','계시별, 고정비↑ 변동비↓ → 많이 쓰는 곳. 계약 1kW당 월 200kWh 이상(이용률 ≈28%)이면 Ⅱ 유리')}
        ${td('Ⅲ',base('Ⅲ'),flat('Ⅲ'),'2026.6.1 신설. 시간대 이동이 어려운 곳이 계시별을 포기하는 옵션 (갑Ⅰ과 동일 단가)')}
        ${td('Ⅳ',base('Ⅳ'),flat('Ⅳ'),'Ⅲ의 고사용량 버전')}
      </tbody></table>
      <div style="margin:10px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink-2)">
        <p style="margin:0 0 6px"><b>Ⅰ vs Ⅱ (또는 Ⅲ vs Ⅳ)</b>: 번호가 올라가면 kW당 1,060원 더 내고 kWh당 5.3원 덜 냅니다 → 계약 1kW당 월 200kWh 이상(이용률 약 28%) 쓰면 Ⅱ가 유리. 24시간 돌아가는 편의점·데이터룸은 Ⅱ, 낮에만 여는 사무실은 Ⅰ.</p>
        <p style="margin:0 0 6px"><b>Ⅰ·Ⅱ vs Ⅲ·Ⅳ</b>: 2026년 개편으로 최대부하가 15~21시 저녁으로 옮겨가면서, 저녁 장사하는 식당·상가는 계시별이 오히려 손해가 됐어요. 그래서 한전이 "시간대 안 보고 계절 단일로 낼래?" 하는 Ⅲ·Ⅳ를 만들었습니다. 2026년 6~11월분은 한전이 Ⅰ↔Ⅲ, Ⅱ↔Ⅳ 중 싼 쪽을 자동으로 적용해 주고, 12월분부터 고객이 직접 선택.</p>
        <p style="margin:0"><b>HEMS 관점</b>: Ⅰ·Ⅱ만 부하 이동 효과가 있고, Ⅲ·Ⅳ는 시간대가 없으니 절감 레버가 "덜 쓰기"뿐입니다.</p>
      </div>
    </div>
    <div class="srcrow">${srcChip('A1 제57조·제23조·별표1 1.나 / 확정')}${srcChip('A1 부칙 2026.5.22 (선택Ⅲ·Ⅳ) / 확정')}</div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  $('#verLabel').textContent=DATA.version.ver; $('#dateLabel').textContent=DATA.version.date;
  const season=seasonOf(S.month);
  $('#homeSub').textContent=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} · ${S.view} · ${S.region}${S.view==='요금'?' · '+S.kind:''} · ${S.month}월 = ${season.name}${S.region==='제주'&&S.kind!=='주택용'?' (제주 시간대는 계절 무관)':''}`;
  $('#viewPicks').innerHTML=['요금','DR','이력·용어'].map(v=>`<button class="pk view" data-view="${v}" aria-pressed="${v===S.view}">${v}</button>`).join('');
  $('#kindPicker').hidden=(S.view!=='요금');
  $('#regionPicks').innerHTML=['육지','제주'].map(r=>`<button class="pk" data-region="${r}" aria-pressed="${r===S.region}">${r}</button>`).join('');
  $('#kindPicks').innerHTML=KINDS.map(k=>`<button class="pk" data-kind="${k}" aria-pressed="${k===S.kind}">${k}</button>`).join('');
  $('#dayPicks').innerHTML=['평일','토요일','공휴일'].map(d=>`<button class="pk sm" data-day="${d}" aria-pressed="${d===S.day}">${d}</button>`).join('');
  const ms=$('#monthSel'); if(!ms.options.length){ for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'월';ms.appendChild(o);} } ms.value=S.month;

  let cards='';
  if(S.view==='DR'){ cards=drCard()+kookCard()+plusCard()+drTypesCard()+drRegionCard()+drHemsCard()+incentiveCard(); $('#grid').innerHTML=cards; bind(); return; }
  if(S.view==='이력·용어'){ cards=policyCard()+incentiveCard()+regionCard()+glossaryCard()+historyCard(); $('#grid').innerHTML=cards; bind(); return; }
  if(S.kind==='주택용'){ cards=progCard(season)+touCard(season)+houseTouCard(season)+hpCard(season); }
  else if(S.kind==='EV 충전전력'){ cards=touCard(season)+evCard(season); }
  else { cards=touCard(season)+rateCard(season)+(S.kind==='일반용'?generalGuideCard(season):''); }

  $('#grid').innerHTML=cards;
  bind();
}
function bind(){
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render();});
  document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{S.region=b.dataset.region;render();});
  document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{S.kind=b.dataset.kind;render();});
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{S.day=b.dataset.day;render();});
  $('#monthSel').onchange=e=>{S.month=+e.target.value;render();};
  const dbs=['#deferBtn','#deferBtn2']; dbs.forEach(id=>{const b=$(id); if(b) b.onclick=()=>{S.defer=!S.defer;render();};});
  document.querySelectorAll('.hv').forEach(b=>b.onclick=()=>{S.rateSel.houseVolt=b.dataset.v;render();});
  document.querySelectorAll('.rg').forEach(b=>b.onclick=()=>{S.rateSel[S.kind+'_g']=b.dataset.g;render();});
  document.querySelectorAll('.ev').forEach(b=>b.onclick=()=>{S.evVolt=b.dataset.v;render();});
  document.querySelectorAll('.evhome').forEach(b=>b.onclick=()=>{S.evHome=b.dataset.v;render();});
  const cs=$('#comboSel'); if(cs) cs.onchange=e=>{const g=S.rateSel[S.kind+'_g']||[...new Set(DATA.rates.filter(r=>r.kind.startsWith(S.kind)).map(r=>r.kind))].pop(); S.rateSel[g+'_c']=e.target.value; render();};
  const ur=$('#useRange'); if(ur){ ur.oninput=e=>{S.use=+e.target.value; render(); const n=$('#useRange'); if(n) n.focus();}; }
  const num=(id,fn)=>{const el=$(id); if(el) el.onchange=e=>{fn(+e.target.value||0); render();};};
  num('#shLow',v=>S.share.low=v); num('#shMid',v=>S.share.mid=v); num('#shPeak',v=>S.share.peak=v);
  num('#evH',v=>S.evH=v); num('#evE',v=>S.evE=v); num('#evK',v=>S.evK=Math.max(1,v));
  num('#hpL',v=>S.hpL=v); num('#hpK',v=>S.hpK=Math.max(1,v));
  num('#evL',v=>S.evShare.low=v); num('#evM',v=>S.evShare.mid=v); num('#evP',v=>S.evShare.peak=v);
}
render();
</script>

</body></html>
