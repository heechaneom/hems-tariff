name: collect-sources
on:
  schedule:
    - cron: '30 0 * * 1'    # 매주 월요일 09:30 KST (루틴 10:00 직전)
  workflow_dispatch:         # 수동 실행 버튼
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/collect.py
      - name: commit snapshots
        run: |
          git config user.name "collector"
          git config user.email "collector@hems-tariff"
          git add snapshots
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "snapshots: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
