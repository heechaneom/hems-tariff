name: collect-sources
on:
  schedule:
    - cron: '30 23 * * *'   # 08:30 KST 매일
  workflow_dispatch:         # 수동 실행 버튼
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python scripts/collect.py
      - name: commit snapshots
        run: |
          git config user.name "collector"
          git config user.email "collector@hems-tariff"
          git add snapshots
          git diff --cached --quiet && echo "no change" || git commit -m "snapshots: $(TZ=Asia/Seoul date +%F)"
          git push
